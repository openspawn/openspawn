name: Publish CLI

on:
  push:
    tags:
      - "openspawn@*" # e.g. openspawn@2026.3.18
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2026.3.18). Leave empty to use package.json version."
        required: false
        type: string
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: packages/openspawn

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm exec nx lint openspawn
        working-directory: .

      - name: Test
        run: pnpm exec vitest run --config vitest.config.ts

      - name: Build
        run: pnpm run build

      - name: Verify CLI runs
        run: node dist/cli/index.js --version

      - name: Set version (if provided)
        if: inputs.version
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (dry run)
        if: inputs.dry_run
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
