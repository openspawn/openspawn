name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openspawn
          POSTGRES_PASSWORD: openspawn
          POSTGRES_DB: openspawn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI codegen is up to date
        run: |
          pnpm run codegen
          if ! git diff --quiet libs/dashboard-data/src/rest/generated/; then
            echo "❌ Generated types are out of date. Run 'pnpm run codegen' and commit."
            git diff --stat libs/dashboard-data/src/rest/generated/
            exit 1
          fi
          echo "✅ Codegen files are up to date"

      - name: Lint
        run: pnpm exec nx run-many -t lint --parallel=3
        continue-on-error: true # Don't fail on lint for now

      - name: Build
        run: pnpm exec nx run-many -t build --parallel=3 --exclude=dashboard

      - name: Test
        run: pnpm exec nx run-many -t test --parallel=3
        continue-on-error: true # Tests have pre-existing failures
        env:
          DATABASE_URL: postgres://openspawn:openspawn@localhost:5432/openspawn

  python-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check app/ tests/

      - name: Format check
        run: uv run ruff format --check app/ tests/

      - name: Type check
        run: uv run pyright app/

      - name: Test
        run: uv run pytest tests/ -v
