name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - "apps/demo/**"
      - "apps/team/**"
      - "apps/website/**"
      - "apps/api/**"
      - "tools/sandbox/**"
      - "libs/**"
      - "deploy/**"
      - "Dockerfile"
      - "pnpm-lock.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: /opt/openspawn
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -e
            cd /opt/openspawn

            # Source .env.production so compose interpolation works
            touch .env.production
            set -a && source .env.production && set +a

            # Log in to GHCR to pull the image
            echo "${GH_TOKEN}" | docker login ghcr.io -u github-actions --password-stdin

            # Pull only the images this workflow builds
            docker compose pull app api postgres

            # Stop native sandbox service if running (port 3333 conflict)
            systemctl stop sandbox 2>/dev/null || true
            systemctl disable sandbox 2>/dev/null || true
            fuser -k 3333/tcp 2>/dev/null || true
            sleep 2

            # Update Caddy config and reload
            cp Caddyfile /etc/caddy/Caddyfile 2>/dev/null && systemctl reload caddy 2>/dev/null || true

            # Force recreate to pick up compose changes + new images
            docker compose up -d app api postgres --force-recreate --remove-orphans

            # Run Alembic migrations
            echo "⏳ Running database migrations..."
            docker compose exec -T api alembic upgrade head || echo "⚠️ Migration failed (may be first deploy)"

            # Wait for app to be healthy (up to 60s)
            echo "⏳ Waiting for app to start..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3333/api/state > /dev/null 2>&1; then
                echo "✅ Demo app healthy!"
                break
              fi
              echo "  Attempt $i/12 — waiting 5s..."
              sleep 5
            done

            # Wait for API to be healthy (up to 60s)
            echo "⏳ Waiting for API to start..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ API healthy!"
                docker image prune -f
                exit 0
              fi
              echo "  Attempt $i/12 — waiting 5s..."
              sleep 5
            done

            # Failed — dump logs
            echo "❌ Health check failed after 60s"
            echo "=== App logs ==="
            docker compose logs --tail=100 app
            echo "=== API logs ==="
            docker compose logs --tail=100 api
            echo "=== Container status ==="
            docker compose ps
            exit 1

      - name: Purge Cloudflare cache (bikinibottom.ai)
        if: success()
        run: |
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID_BIKINIBOTTOM_DOT_AI }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_PURGE_CACHE_API_TOKEN_BIKINIBOTTOM_DOT_AI }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' > /dev/null
          echo "✅ Cloudflare cache purged (bikinibottom.ai)"
