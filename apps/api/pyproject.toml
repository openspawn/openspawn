[project]
name = "openspawn-api"
version = "0.1.0"
description = "OpenSpawn API — FastAPI backend for multi-agent coordination"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "asyncpg>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "httpx>=0.28",
  "pendulum>=3.0",
  "alembic>=1.18.4",
  "pgvector>=0.3",
  "cryptography>=46.0.5",
  "fastmcp>=3.1.0",
  "instructor>=1.7",
  "litellm>=1.55",
  "voyageai>=0.3",
  "openai>=1.60",
  "tenacity>=9.0",
  "logfire[fastapi,sqlalchemy]>=4.27.0",
  "langfuse>=3.14.5",
  "opentelemetry-instrumentation-httpx>=0.60b1",
  "arq>=0.27.0",
  "redis>=5.3.1",
  "aiosqlite>=0.20.0",
]

[project.scripts]
openspawn-server = "app.local:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "pyright>=1.1",
  "respx>=0.22",
  "factory-boy>=3.3",
  "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # ruff-specific
  "ASYNC", # flake8-async
]
ignore = [
  "E501", # line length handled by formatter
  "B008", # Depends() in function defaults is standard FastAPI pattern
  "UP046", # Generic[T] required for Pydantic BaseModel generics
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["TCH001", "TCH003"] # SQLAlchemy needs runtime imports
"app/auth/*.py" = ["TCH002"] # FastAPI dependencies need runtime type annotations
"app/*/schemas.py" = ["TCH001", "TCH002", "TCH003"] # Pydantic needs runtime type imports
"app/*/router.py" = ["TCH002", "TCH003"] # FastAPI routes need runtime type imports
"app/schemas/*.py" = ["TCH003"] # Pydantic needs runtime type imports
"app/mcp_server/*.py" = ["TCH002", "TCH003"] # MCP tools need runtime type imports
"app/memory/*.py" = ["TCH003"] # Pydantic models need runtime type imports
"app/memory/graph/router.py" = ["TCH002", "TCH003"] # FastAPI routes need runtime type imports
"app/local.py" = ["ASYNC240"] # Sync path ops are fine in startup-only async code
"tests/*.py" = ["TCH002"] # Test fixtures need runtime type imports

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
