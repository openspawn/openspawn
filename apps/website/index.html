        <h1>OpenSpawn — Coordination Layer for AI Agent Organizations</h1>
        <p>
          OpenSpawn is an open-source coordination layer that lets you define and run organizations
          of AI agents. One markdown file (ORG.md) defines your entire agent org — roles, hierarchy,
          culture, policies, and playbooks.
        </p>

        <h2>What is OpenSpawn?</h2>
        <p>
          OpenSpawn is infrastructure, not a framework. It coordinates agents built with CrewAI,
          LangGraph, AutoGen, OpenClaw, or any other agent framework. Think of it as the org chart
          and HR department for your AI workforce.
        </p>

        <h2>Key Features</h2>
        <ul>
          <li>
            <strong>ORG.md</strong> — Your entire agent organization defined in a single markdown
            file.
          </li>
          <li>
            <strong>Framework-Agnostic</strong> — Works with any agent framework. OpenSpawn
            coordinates, frameworks execute.
          </li>
          <li>
            <strong>MCP-Native</strong> — Built-in Model Context Protocol server with 7 tools.
          </li>
          <li><strong>A2A Protocol</strong> — Agent-to-Agent communication via Google A2A v0.3.</li>
          <li>
            <strong>Economic Layer</strong> — Budget management, trust scores, performance tracking.
          </li>
          <li>
            <strong>Self-Hosted</strong> — Run on your own infrastructure. Zero external
            dependencies.
          </li>
          <li>
            <strong>Simulation Modes</strong> — Deterministic ($0), hybrid (LLM), record, and
            replay.
          </li>
        </ul>

        <h2>Quick Start</h2>
        <pre><code>npx openspawn init my-org</code></pre>

        <h2>Live Demo</h2>
