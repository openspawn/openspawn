# ── OpenSpawn VPS Docker Compose ──────────────────────────────────────────────
# Three services:
#   - app (port 3333)      — BikiniBottom demo at bikinibottom.ai
#   - api (port 8000)      — FastAPI backend at openspawn.ai/api/
#   - platform (port 3334) — OpenSpawn landing at openspawn.ai
# System Caddy handles HTTPS reverse proxy (see Caddyfile)
#
# Expected at /opt/openspawn/docker-compose.yml on the VPS

services:
  app:
    image: ghcr.io/openspawn/openspawn:latest
    container_name: bikinibottom
    restart: unless-stopped
    environment:
      - SANDBOX_PORT=3333
      - SERVE_DASHBOARD=1
      - SANDBOX_READONLY=1
      - DASHBOARD_DIR=/app/dashboard-dist
      - NODE_ENV=production
    env_file:
      - .env.production
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/api/state"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/openspawn/openspawn-api:latest
    container_name: openspawn-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: openspawn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openspawn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openspawn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openspawn}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform:
    image: ghcr.io/openspawn/openspawn-platform:latest
    container_name: openspawn-platform
    restart: unless-stopped
    environment:
      - PORT=3334
      - PLATFORM_DIR=/app/dist
      - NODE_ENV=production
    ports:
      - "3334:3334"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3334/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
