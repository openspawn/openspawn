# Development overrides - use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  # Only start postgres and litellm for local development
  # API, MCP, and demo run on host via pnpm nx serve

  api:
    build:
      context: apps/api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/openspawn
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  mcp:
    profiles: ["full"]

  demo:
    profiles: ["full"]

  langfuse:
    profiles: ["full", "observability"]

  postgres:
    ports:
      - "5432:5432"

  litellm:
    ports:
      - "4000:4000"
    environment:
      LITELLM_LOG: DEBUG
