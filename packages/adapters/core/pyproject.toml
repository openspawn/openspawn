[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openspawn"
version = "0.1.0"
description = "Python client for the OpenSpawn agent infrastructure API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenSpawn", email = "hello@openspawn.ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-httpx>=0.30.0", "ruff>=0.4.0"]

[project.urls]
Homepage = "https://openspawn.ai"
Repository = "https://github.com/openspawn/openspawn"
Documentation = "https://docs.openspawn.ai"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["openspawn"]
