[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openspawn-crewai"
version = "0.1.0"
description = "OpenSpawn adapter for CrewAI — report crew activity to OpenSpawn infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenSpawn", email = "hello@openspawn.ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["openspawn>=0.1.0"]

[project.optional-dependencies]
crewai = ["crewai>=0.28.0"]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

[project.urls]
Homepage = "https://openspawn.ai"
Repository = "https://github.com/openspawn/openspawn"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["openspawn_crewai"]
