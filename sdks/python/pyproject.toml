[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openspawn"
version = "2026.3.3"
description = "Python SDK for OpenSpawn — Coordination layer for AI agent organizations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "OpenSpawn", email = "hello@openspawn.ai"}
]
keywords = [
    "ai", "agents", "multi-agent", "coordination", "orchestration",
    "mcp", "a2a", "openspawn", "crewai", "langchain", "autogen"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://openspawn.ai"
Documentation = "https://openspawn.ai/docs"
Repository = "https://github.com/openspawn/openspawn"
"Bug Tracker" = "https://github.com/openspawn/openspawn/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["openspawn*"]
